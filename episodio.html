<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Episódio IA Explica — @cotocopositivo</title>
  <meta name="description" content="Episódio completo do IA Explica com os 3 Níveis, Comparador Contrafactual, Quiz Relâmpago e Resumo de Bolso.">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="CotocoPositivo">
  <meta property="og:title" id="og-title" content="IA Explica — @cotocopositivo">
  <meta property="og:description" id="og-description" content="Neurociência, IA e positividade prática em 3 níveis.">
  <meta property="og:image" id="og-image" content="https://cotocopositivo.vercel.app/assets/thumbs/ep_056.webp">
  <meta property="og:url" id="og-url" content="https://cotocopositivo.vercel.app/episodio.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0A0E17">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-mascot.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="nav-bar">
    <a href="index.html" class="logo">
      <span class="logo-accent">@cotocopositivo</span>
      <span class="logo-tag">EPISÓDIO</span>
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Abrir menu">☰</button>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Início</a>
      <a href="biblioteca.html" class="nav-gold">Biblioteca</a>
      <a href="desafio-30-dias.html" class="nav-emerald">Desafio 30 Dias</a>
      <a href="jogos.html">Ferramentas & Jogos</a>
      <a href="sobre.html">Mídia Kit</a>
    </div>
  </nav>

  <main class="container">
    <section class="glass-card" id="single-episode-shell">
      <p class="section-subtitle">Carregando episódio...</p>
    </section>
  </main>

  <footer class="footer">
    <p>🌿 <strong>@cotocopositivo</strong> • <a href="index.html">Voltar ao Portal</a></p>
    <div class="footer-nav">
      <a href="index.html">Início</a>
      <a href="biblioteca.html">Biblioteca</a>
      <a href="desafio-30-dias.html">Desafio 30 Dias</a>
      <a href="certificado.html">Certificado</a>
      <a href="sobre.html">Sobre & Mídia Kit</a>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const shell = document.getElementById('single-episode-shell');
      if (!shell) return;

      const params = new URLSearchParams(window.location.search);
      const epNum = parseInt(params.get('ep') || '56', 10) || 56;

      try {
        const res = await fetch('public/data/ia-explica/index.json');
        const data = await res.json();
        const list = Array.isArray(data.episodios) ? data.episodios : [];
        episodesCache = list;
        const ep = list.find((e) => Number(e.numero) === epNum) || list[0];
        if (!ep) {
          shell.innerHTML = '<p class="section-subtitle">Episódio não encontrado.</p>';
          return;
        }

        const numStr = String(ep.numero).padStart(3, '0');
        const ogTitle = `IA Explica #${numStr}: ${ep.titulo} — @cotocopositivo`;
        const ogDesc = ep.resumo || 'Neurociência e IA em 3 níveis práticos.';
        const ogImg = `${window.location.origin}/assets/thumbs/ep_${numStr}.webp`;

        document.title = ogTitle;
        document.getElementById('og-title')?.setAttribute('content', ogTitle);
        document.getElementById('og-description')?.setAttribute('content', ogDesc);
        document.getElementById('og-image')?.setAttribute('content', ogImg);
        document.getElementById('og-url')?.setAttribute('content', window.location.href);

        const detailed = await fetchEpisodeDetail(ep);
        const niveis = (detailed && detailed.niveis) || ep.niveis || {};
        const iniText = typeof niveis.iniciante === 'object' ? niveis.iniciante.texto : niveis.iniciante;
        const sabText = typeof niveis.sabio === 'object' ? niveis.sabio.texto : niveis.sabio;
        const mesText = typeof niveis.mestre_positivo === 'object' ? niveis.mestre_positivo.texto : niveis.mestre_positivo;
        const livro = (detailed && detailed.livro_apoio) || ep.livro_apoio || null;
        const trainUrl = (ep.ferramenta_treino && ep.ferramenta_treino.url) || 'jogos.html';

        trackEpisodeClick(ep, 'pagina_episodio');
        awardEpisodeXp(ep.numero);
        unlockCardForEpisode(ep.numero, true);

        shell.innerHTML = `
          <div class="ep-meta-row">
            <span class="badge badge-gold">IA Explica #${numStr}</span>
            <span class="badge">${escapeHtml(ep.tema)}</span>
            <span class="badge badge-emerald">${escapeHtml(ep.estilo_visual)}</span>
          </div>
          <h1 class="section-title" style="margin-top:8px;">${escapeHtml(ep.titulo)}</h1>
          <p class="section-subtitle" style="margin-bottom:18px;">${escapeHtml(ep.resumo || '')}</p>

          <div class="video-wrapper" style="margin-bottom:22px;">
            <iframe
              src="https://www.youtube.com/embed/${encodeURIComponent(ep.youtube_video_id)}?rel=0"
              title="IA Explica #${numStr}"
              loading="lazy"
              allowfullscreen>
            </iframe>
          </div>

          <div class="level-box">
            <h4 style="color: var(--cyan);">🌱 Nível 1 • Iniciante</h4>
            <p>${escapeHtml(iniText || '')}</p>
          </div>
          <div class="level-box sabio">
            <h4 style="color: var(--emerald);">🦉 Nível 2 • Sábio</h4>
            <p>${escapeHtml(sabText || '')}</p>
          </div>
          <div class="level-box mestre">
            <h4 style="color: var(--gold);">⚡ Nível 3 • Mestre Positivo</h4>
            <p>${escapeHtml(mesText || '')}</p>
          </div>

          ${buildCounterfactualHtml(ep, detailed, 'single-cf')}

          ${livro ? `
            <div class="book-banner">
              <div>
                <div style="font-size:0.74rem;font-weight:800;color:var(--gold);">📚 LIVRO RECOMENDADO</div>
                <div style="font-weight:800;font-size:1.02rem;">${escapeHtml(livro.titulo)}</div>
                <div style="font-size:0.85rem;color:var(--text-muted);">${escapeHtml(livro.autor || '')}</div>
              </div>
              <a href="${escapeHtml(livro.url)}" target="_blank" rel="noopener" class="btn btn-gold btn-sm">Ver na ${escapeHtml(livro.plataforma || 'Amazon')} ↗</a>
            </div>
          ` : ''}

          <div class="card-actions-row" style="margin-top:18px;">
            <button class="btn btn-gold btn-sm" id="single-pocket-btn">📱 Baixar Resumo de Bolso (1080x1920)</button>
            <a href="${escapeHtml(trainUrl)}" class="btn btn-emerald btn-sm">🎮 Treinar Habilidade</a>
            <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(ogTitle + ' ' + window.location.href)}" target="_blank" rel="noopener" class="btn btn-sm">💬 Compartilhar no WhatsApp</a>
          </div>

          <div id="single-quiz-container"></div>
        `;

        initCounterfactualControls(shell);
        document.getElementById('single-pocket-btn')?.addEventListener('click', () => downloadPocketSummary(ep, detailed));
        const quizEl = document.getElementById('single-quiz-container');
        if (quizEl) renderQuizSection(quizEl, ep, detailed);
      } catch (err) {
        shell.innerHTML = '<p class="section-subtitle">Não foi possível carregar este episódio offline ainda. Visite a página inicial conectado uma vez para sincronizar.</p>';
      }
    });
  </script>
</body>
</html>
