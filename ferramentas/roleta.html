<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roda da Transformacao - Cotoco Positivo</title>
  <style>
    :root {
      --brand: #6C5CE7;
      --brand-hover: #5644d6;
      --accent: #00B894;
      --bg: #FDFBF7;
      --card-bg: #FFFFFF;
      --text: #2D3436;
      --text-muted: #636E72;
      --border: #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .nav-bar {
      background: #FFFFFF;
      border-bottom: 2px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo {
      font-weight: 800;
      font-size: 20px;
      color: var(--brand);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 16px; align-items: center; }
    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 15px;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--brand); }
    .nav-links a.highlight-link { color: var(--accent); }
    .nav-links a.yt-link {
      background: #FF0000;
      color: #FFF;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
    }
    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }
    .game-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 2px solid var(--border);
      padding: 30px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    }
    .btn {
      background: var(--brand);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      display: inline-block;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: var(--brand-hover); }
    .btn:active { transform: scale(0.98); }
    .footer {
      background: #FFFFFF;
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 40px;
    }
    .footer a { color: var(--brand); text-decoration: none; margin: 0 8px; }
  </style>
</head>
<body>

  <nav class="nav-bar">
    <a href="../index.html" class="logo">🌿 Cotoco Positivo</a>
    <div class="nav-links">
      <a href="../index.html">Inicio</a>
      <a href="../jogos.html">Jogos</a>
      <a href="../ebook.html" class="highlight-link">Guia Pratico</a>
      <a href="https://www.youtube.com/@cotocopositivo?sub_confirmation=1" target="_blank" class="yt-link">Canal YouTube</a>
    </div>
  </nav>

  <div class="container">
    <div class="game-card">
      <h1 style="color: var(--brand); margin-bottom: 8px;">🎡 Roda da Transformacao</h1>
      <p style="color: var(--text-muted); margin-bottom: 24px;">Gire para receber um compromisso de acao saudavel para hoje.</p>
      
      <div id="wheel" style="width:160px; height:160px; border-radius:50%; border:8px dashed var(--brand); margin:0 auto 24px; display:flex; align-items:center; justify-content:center; font-size:42px; transition:transform 2.5s cubic-bezier(0.17, 0.67, 0.12, 0.99);">
        🎯
      </div>

      <button class="btn" id="spin-btn">Girar a Roda</button>
      <div id="result-action" style="font-weight:700; margin-top:20px; font-size:18px; color:var(--text);"></div>
    </div>
  </div>

  <script src="../cotoco-share.js"></script>
  <script>
    const actions = [
      "Tomar 1 copo de agua e respirar fundo.",
      "Fazer uma caminhada de 10 minutos sem telas.",
      "Enviar uma mensagem gentil a quem voce ama.",
      "Organizar seu espaco de trabalho com leveza.",
      "Praticar 5 minutos de alongamento e foco."
    ];

    const wheel = document.getElementById('wheel');
    const btn = document.getElementById('spin-btn');
    const result = document.getElementById('result-action');
    let deg = 0;

    btn.onclick = () => {
      btn.disabled = true;
      deg += 1440 + Math.floor(Math.random() * 360);
      wheel.style.transform = `rotate(${deg}deg)`;

      setTimeout(() => {
        const picked = actions[Math.floor(Math.random() * actions.length)];
        result.textContent = "Missao: " + picked;
        btn.disabled = false;

        CotocoShare.show({
          gameTitle: "Roda da Transformacao",
          message: `Minha missao de bem-estar de hoje: ${picked}`,
          customWppText: `Girei a Roda da Transformacao no Cotoco Positivo e tirei: "${picked}"! 🌿 Faca o seu: ${CotocoShare.config.channelUrl}`
        });
      }, 2600);
    };
  </script>

  <footer class="footer">
    <p>🌿 <strong>Cotoco Positivo</strong> • Cultivando habitos, clareza e bem-estar diario.</p>
    <p style="margin-top: 8px;">
      <a href="https://www.youtube.com/@cotocopositivo?sub_confirmation=1" target="_blank">YouTube</a> |
      <a href="https://instagram.com/cotocopositivo" target="_blank">Instagram</a> |
      <a href="https://www.tiktok.com/@cotocopositivo" target="_blank">TikTok</a> |
      <a href="https://www.facebook.com/profile.php?id=61592308025021" target="_blank">Facebook</a> |
      <a href="https://substack.com/@cotocopositivo" target="_blank">Substack</a> |
      <a href="../ebook.html">E-book Oficial</a>
    </p>
  </footer>
</body></html>
