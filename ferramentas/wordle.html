<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Termo Positivo - Cotoco Positivo</title>
  <style>
    :root {
      --brand: #6C5CE7;
      --brand-hover: #5644d6;
      --accent: #00B894;
      --bg: #FDFBF7;
      --card-bg: #FFFFFF;
      --text: #2D3436;
      --text-muted: #636E72;
      --border: #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .nav-bar {
      background: #FFFFFF;
      border-bottom: 2px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo {
      font-weight: 800;
      font-size: 20px;
      color: var(--brand);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 16px; align-items: center; }
    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 15px;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--brand); }
    .nav-links a.highlight-link { color: var(--accent); }
    .nav-links a.yt-link {
      background: #FF0000;
      color: #FFF;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
    }
    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }
    .game-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 2px solid var(--border);
      padding: 30px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    }
    .btn {
      background: var(--brand);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      display: inline-block;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: var(--brand-hover); }
    .btn:active { transform: scale(0.98); }
    .footer {
      background: #FFFFFF;
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 40px;
    }
    .footer a { color: var(--brand); text-decoration: none; margin: 0 8px; }
  </style>
</head>
<body>

  <nav class="nav-bar">
    <a href="../index.html" class="logo">🌿 Cotoco Positivo</a>
    <div class="nav-links">
      <a href="../index.html">Inicio</a>
      <a href="../jogos.html">Jogos</a>
      <a href="../ebook.html" class="highlight-link">Guia Pratico</a>
      <a href="https://www.youtube.com/@cotocopositivo?sub_confirmation=1" target="_blank" class="yt-link">Canal YouTube</a>
    </div>
  </nav>

  <div class="container">
    <div class="game-card">
      <h1 style="color: var(--brand); margin-bottom: 8px;">🔤 Termo Positivo</h1>
      <p style="color: var(--text-muted); margin-bottom: 20px;">Descubra a palavra positiva de 5 letras em ate 4 tentativas.</p>
      
      <div id="board" style="display:flex; flex-direction:column; gap:8px; align-items:center; margin-bottom:20px;">
        <input type="text" id="term-input" maxlength="5" placeholder="5 LETRAS" style="text-transform:uppercase; font-size:20px; font-weight:800; letter-spacing:6px; text-align:center; padding:10px; border-radius:8px; border:2px solid var(--border); width:200px;">
        <button class="btn" id="submit-term" style="margin-top:10px;">Verificar Palavra</button>
      </div>
      <div id="history" style="display:flex; flex-direction:column; gap:6px; align-items:center;"></div>
    </div>
  </div>

  <script src="../cotoco-share.js"></script>
  <script>
    const secret = "FORCA";
    let attempts = 0;

    document.getElementById('submit-term').onclick = () => {
      const input = document.getElementById('term-input');
      const val = input.value.toUpperCase().trim();
      if (val.length !== 5) {
        alert("A palavra precisa ter exatamente 5 letras!");
        return;
      }

      attempts++;
      const row = document.createElement('div');
      row.style.cssText = "display:flex; gap:6px;";

      for (let i = 0; i < 5; i++) {
        const box = document.createElement('span');
        box.textContent = val[i];
        box.style.cssText = "width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; font-weight:800; border-radius:6px; color:#FFF;";

        if (val[i] === secret[i]) {
          box.style.background = "#00B894"; // Correta
        } else if (secret.includes(val[i])) {
          box.style.background = "#F59E0B"; // Existe
        } else {
          box.style.background = "#64748B"; // Incorreta
        }
        row.appendChild(box);
      }

      document.getElementById('history').appendChild(row);
      input.value = "";

      if (val === secret) {
        CotocoShare.show({
          gameTitle: "Termo Positivo",
          message: `Acertei a palavra ${secret} em ${attempts} tentativas!`,
          customWppText: `Venci o Termo Positivo descobrindo ${secret} no Cotoco Positivo! 🌿 Jogue agora: ${CotocoShare.config.channelUrl}`
        });
      } else if (attempts >= 4) {
        alert("Fim das tentativas! A palavra era: " + secret);
      }
    };
  </script>

  <footer class="footer">
    <p>🌿 <strong>Cotoco Positivo</strong> • Cultivando habitos, clareza e bem-estar diario.</p>
    <p style="margin-top: 8px;">
      <a href="https://www.youtube.com/@cotocopositivo?sub_confirmation=1" target="_blank">YouTube</a> |
      <a href="https://instagram.com/cotocopositivo" target="_blank">Instagram</a> |
      <a href="https://www.tiktok.com/@cotocopositivo" target="_blank">TikTok</a> |
      <a href="https://www.facebook.com/profile.php?id=61592308025021" target="_blank">Facebook</a> |
      <a href="https://substack.com/@cotocopositivo" target="_blank">Substack</a> |
      <a href="../ebook.html">E-book Oficial</a>
    </p>
  </footer>
</body></html>
