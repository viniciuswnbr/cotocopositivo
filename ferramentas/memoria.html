<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memoria do Afeto - Cotoco Positivo</title>
  <style>
    :root {
      --brand: #6C5CE7;
      --brand-hover: #5644d6;
      --accent: #00B894;
      --bg: #FDFBF7;
      --card-bg: #FFFFFF;
      --text: #2D3436;
      --text-muted: #636E72;
      --border: #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .nav-bar {
      background: #FFFFFF;
      border-bottom: 2px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .logo {
      font-weight: 800;
      font-size: 20px;
      color: var(--brand);
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 16px; align-items: center; }
    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      font-size: 15px;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--brand); }
    .nav-links a.highlight-link { color: var(--accent); }
    .nav-links a.yt-link {
      background: #FF0000;
      color: #FFF;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
    }
    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }
    .game-card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 2px solid var(--border);
      padding: 30px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    }
    .btn {
      background: var(--brand);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      display: inline-block;
      text-decoration: none;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: var(--brand-hover); }
    .btn:active { transform: scale(0.98); }
    .footer {
      background: #FFFFFF;
      border-top: 1px solid var(--border);
      padding: 24px;
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 40px;
    }
    .footer a { color: var(--brand); text-decoration: none; margin: 0 8px; }
  </style>
</head>
<body>

  <nav class="nav-bar">
    <a href="../index.html" class="logo">🌿 Cotoco Positivo</a>
    <div class="nav-links">
      <a href="../index.html">Inicio</a>
      <a href="../jogos.html">Jogos</a>
      <a href="../ebook.html" class="highlight-link">Guia Pratico</a>
      <a href="https://www.youtube.com/@cotocopositivo?sub_confirmation=1" target="_blank" class="yt-link">Canal YouTube</a>
    </div>
  </nav>

  <div class="container">
    <div class="game-card">
      <h1 style="color: var(--brand); margin-bottom: 8px;">🧩 Memoria do Afeto</h1>
      <p style="color: var(--text-muted); margin-bottom: 24px;">Encontre os pares de simbolos positivos para acalmar a mente.</p>
      
      <div id="memory-board" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; max-width: 400px; margin: 0 auto 24px;"></div>
      <div id="moves" style="color: var(--text-muted); font-size: 15px;">Movimentos: 0</div>
    </div>
  </div>

  <script src="../cotoco-share.js"></script>
  <script>
    const icons = ['🌸', '☀️', '🌱', '🕊️', '💖', '⭐'];
    const cards = [...icons, ...icons].sort(() => Math.random() - 0.5);
    const board = document.getElementById('memory-board');
    let first = null;
    let second = null;
    let lock = false;
    let matches = 0;
    let moves = 0;

    cards.forEach((icon, i) => {
      const card = document.createElement('div');
      card.style.cssText = "aspect-ratio:1; background:#EEF2FF; border:2px solid #C7D2FE; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:28px; cursor:pointer; user-select:none;";
      card.dataset.icon = icon;
      card.dataset.index = i;
      card.textContent = "❓";

      card.onclick = () => {
        if (lock || card.textContent !== "❓") return;
        card.textContent = icon;
        card.style.background = "#FFFFFF";

        if (!first) {
          first = card;
        } else {
          second = card;
          lock = true;
          moves++;
          document.getElementById('moves').textContent = `Movimentos: ${moves}`;

          if (first.dataset.icon === second.dataset.icon) {
            matches++;
            first = null;
            second = null;
            lock = false;
            if (matches === icons.length) {
              setTimeout(() => {
                CotocoShare.show({
                  gameTitle: "Memoria do Afeto",
                  message: `Conclui o jogo da memoria em ${moves} jogadas!`,
                  customWppText: `Completei o Jogo da Memoria do Afeto no Cotoco Positivo em ${moves} jogadas! 🌿 Confira: ${CotocoShare.config.channelUrl}`
                });
              }, 300);
            }
          } else {
            setTimeout(() => {
              first.textContent = "❓";
              first.style.background = "#EEF2FF";
              second.textContent = "❓";
              second.style.background = "#EEF2FF";
              first = null;
              second = null;
              lock = false;
            }, 800);
          }
        }
      };

      board.appendChild(card);
    });
  </script>

  <footer class="footer">
    <p>🌿 <strong>Cotoco Positivo</strong> • Cultivando habitos, clareza e bem-estar diario.</p>
    <p style="margin-top: 8px;">
      <a href="https://www.youtube.com/@cotocopositivo?sub_confirmation=1" target="_blank">YouTube</a> |
      <a href="https://instagram.com/cotocopositivo" target="_blank">Instagram</a> |
      <a href="https://www.tiktok.com/@cotocopositivo" target="_blank">TikTok</a> |
      <a href="https://www.facebook.com/profile.php?id=61592308025021" target="_blank">Facebook</a> |
      <a href="https://substack.com/@cotocopositivo" target="_blank">Substack</a> |
      <a href="../ebook.html">E-book Oficial</a>
    </p>
  </footer>
</body></html>
